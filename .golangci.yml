version: "2"

linters:
  enable:
    - bodyclose
    - copyloopvar
    - depguard
    - dupl
    - errcheck
    - errorlint
    - goconst
    - gocyclo
    - govet
    - ineffassign
    - misspell
    - noctx
    - nolintlint
    - revive
    - rowserrcheck
    - staticcheck
    - sqlclosecheck
    - testifylint
    - unused

  settings:
    depguard:
      rules:
        domain-layer:
          files:
            - "**/internal/domain/**"
            - "!$test"
          allow:
            - $gostd
        application-layer:
          files:
            - "**/internal/app/**"
            - "!$test"
          allow:
            - $gostd
            - github.com/nikimonax/go-smart-meets/internal/app
            - github.com/nikimonax/go-smart-meets/internal/domain
        infrastructure-layer:
          files:
            - "**/internal/impl/**"
            - "!$test"
          deny:
            - pkg: github.com/nikimonax/go-smart-meets/internal/server
              desc: impl must not depend on server
            - pkg: github.com/nikimonax/go-smart-meets/internal/lib
              desc: impl must not depend on lib
            - pkg: github.com/nikimonax/go-smart-meets/internal/testing
              desc: impl must not depend on testing helpers
            - pkg: github.com/nikimonax/go-smart-meets/cmd
              desc: impl must not depend on cmd

    govet:
      enable-all: true
      disable:
        - fieldalignment

    gocyclo:
      min-complexity: 15

    goconst:
      ignore-tests: true

    dupl:
      threshold: 100

    revive:
      enable-default-rules: true
      rules:
        - name: exported
          disabled: true
        - name: package-comments
          disabled: true

    rowserrcheck:
      packages:
        - database/sql

    nolintlint:
      require-explanation: true
      require-specific: true


formatters:
  enable:
    - gofmt
    - goimports
    - golines
  settings:
    goimports:
      local-prefixes:
        - github.com/nikimonax/go-smart-meets


run:
  timeout: 3m
  issues-exit-code: 1
  tests: true


issues:
  max-issues-per-linter: 0
  max-same-issues: 0
